[project]
name = "swarm-mcp"
version = "0.1.0"
description = "Modular MCP server for the swarm-understanding toolkit (AI Village and friends)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "mcp>=2.3,<3",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.scripts]
swarm-mcp = "swarm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # formatter handles code; long docstrings are fine

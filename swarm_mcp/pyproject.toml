[project]
name = "swarm-mcp"
version = "0.1.0"
description = "Modular MCP server for the swarm-understanding toolkit (AI Village and friends), with the SwarmScope evidence store."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "duckdb>=1.1",
    "networkx>=3.3",
    "pydantic>=2.7",
]

[project.scripts]
swarm-mcp = "swarm_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # formatter handles code; long docstrings are fine

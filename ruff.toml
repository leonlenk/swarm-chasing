# Repo-root ruff config, for running `ruff check` from the repo root.
#
# swarm_mcp/ is not affected: ruff uses the closest config per file, and
# swarm_mcp/pyproject.toml has its own [tool.ruff] (stricter, not inherited from here).
#
# hooks/ and village_tools/swarmtrace/ get a lenient ruleset, the classic defaults:
# syntax errors, undefined names, unused imports and variables. (Without this file
# ruff >= 0.16 applies its much larger default ruleset.)
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Everything else, i.e. the one-off village_tools/*.py research scripts, is not linted.
# (A plain "village_tools/*.py" glob would also match swarmtrace: in ruff globs "*" crosses "/".)
"!{hooks/**,village_tools/swarmtrace/**}" = ["ALL"]
